# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# networkDevice is the CNI NIC. Override a single host on the pool instead.
# cpaas.io/registry-address is REGISTRY_DOMAIN (<PLATFORM_REGISTRY>:11443) after Global is up.
# Never 127.0.0.1 / 172.18.0.1 / bootstrap <BOOTSTRAP_HOST_IP>. LB host is Workload VIP <WORKLOAD_CONTROL_PLANE_VIP>.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalCluster
metadata:
  name: hcs-workloadcluster
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: hcs-workloadcluster
  annotations:
    cpaas.io/registry-address: <PLATFORM_REGISTRY>:11443
spec:
  controlPlaneLoadBalancer:
    type: External
    host: <WORKLOAD_CONTROL_PLANE_VIP>
    port: 6443
  networkType: kube-ovn
  networkDevice: <NETWORK_DEVICE>
