# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Apply only after three workload control-plane hosts have left Live ISO
# and MachineInventory is Ready=True. Fill names from elemental-register.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: <WORKLOAD_CLUSTER_NAME>-control-plane-pool
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <WORKLOAD_CLUSTER_NAME>
spec:
  clusterName: <WORKLOAD_CLUSTER_NAME>
  machineInventories:
    - name: <WORKLOAD_CP_INVENTORY_1>
      hostname: <WORKLOAD_CLUSTER_NAME>-cp-1
    - name: <WORKLOAD_CP_INVENTORY_2>
      hostname: <WORKLOAD_CLUSTER_NAME>-cp-2
    - name: <WORKLOAD_CP_INVENTORY_3>
      hostname: <WORKLOAD_CLUSTER_NAME>-cp-3
