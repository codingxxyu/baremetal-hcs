# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-deployment
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <WORKLOAD_CLUSTER_NAME>
spec:
  clusterName: <WORKLOAD_CLUSTER_NAME>
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-deployment
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-deployment
        cluster.x-k8s.io/cluster-name: <WORKLOAD_CLUSTER_NAME>
        pool.name: <WORKLOAD_CLUSTER_NAME>-arm64-workers
    spec:
      clusterName: <WORKLOAD_CLUSTER_NAME>
      version: v1.35.6-acp.9
      nodeDrainTimeout: 5m
      nodeVolumeDetachTimeout: 5m
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-kubeadm-config
          namespace: cpaas-system
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: BaremetalMachineTemplate
        name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-template
        namespace: cpaas-system
