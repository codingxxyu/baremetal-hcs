# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Apply after workload worker hosts have left Live ISO and are Ready=True.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: <WORKLOAD_CLUSTER_NAME>-arm64-worker-pool
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <WORKLOAD_CLUSTER_NAME>
spec:
  clusterName: <WORKLOAD_CLUSTER_NAME>
  machineInventories:
    - name: <WORKLOAD_ARM64_WORKER_INVENTORY>
      hostname: <WORKLOAD_CLUSTER_NAME>-arm64-worker-1
