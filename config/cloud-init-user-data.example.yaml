runcmd:
  - mkdir -p /etc/rancher/elemental/agent /var/lib/elemental/agent
  - /usr/sbin/elemental-register --debug --install --no-toolkit
      --config-path /etc/elemental/registration/config.yaml
      --state-path /etc/elemental/registration/state.yaml
      > /var/log/preinst-register.log 2>&1
  - systemctl start elemental-system-agent.service elemental-register.timer elemental-storage-observer.service
