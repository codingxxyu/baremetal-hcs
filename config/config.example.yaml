# HCS Bare Metal ACP 4.4.1 single-site worksheet.
# This is the only committed release and environment file in this pack.
# It is not consumed by a renderer. Copy to config/config.local.yaml (gitignored),
# then manually replace the matching placeholders in the numbered YAML/JSON files.
# Never commit passwords, kubeconfigs, ISOs, archives, registration URLs, or keys.
#
# Values already filled below are this site's known facts (VIP / CIDR / package
# names / NIC). Leave <...> as-is until that step actually produces the value
# (image tag after ctr import, inventory name after register, passwords, SSH).

pack:
  name: baremetal-hcs
  version: "0.1.7-draft"
  status: draft
  acp_version: v4.4.1
  namespace: cpaas-system
  dir: /path/to/baremetal-hcs          # export PACK_DIR= this path on the bootstrap node
  kind_cluster: minialauda             # setup.sh name. Do not change.

topology:
  deployment_mode: normal
  load_balancer: External              # only supported path. No VRID.
  global_control_plane_architecture: amd64
  global_control_plane_replicas: 3
  global_worker_replicas: 0
  workload_cluster_name: workloadcluster   # example only. Replace <WORKLOAD_CLUSTER_NAME> in every workload YAML. Must not be "global". Keep one name across all workload objects.
  workload_control_plane_architecture: amd64
  workload_control_plane_replicas: 3
  workload_worker_architecture: arm64
  workload_worker_replicas: 1

release:
  kubernetes: v1.35.6-acp.9            # not v1.35.6-acp.1
  coredns: 1.14.7-v4.4.7               # not 1.14.3-v4.4.6
  etcd: v3.6.13-acp.2                  # not v3.6.13-acp.0
  containerd: 2.2.8-3                  # not 2.2.6-3
  pause: "3.10"
  kube_ovn: v4.4.12                    # not v4.4.6
  core_package: installer-core-v4.4.1-hybrid.tar          # <ACP_4_4_1_HYBRID_CORE_PACKAGE>
  kubeadm_provider_package: cluster-api-provider-kubeadm.ALL.v1.0.14.tgz  # <KUBEADM_PROVIDER_ALL_PACKAGE>
  kubeadm_provider_chart: v1.0.14       # <KUBEADM_PROVIDER_CHART_VERSION>  AppRelease targetRevision
  baremetal_provider_package: cluster-api-provider-baremetal.ALL.v1.0.0-beta.6.ge76cf8f8.tgz  # <BAREMETAL_PROVIDER_ALL_MULTIARCH_PACKAGE>
  baremetal_provider_chart: v1.0.0-beta.6.ge76cf8f8  # <BAREMETAL_PROVIDER_MULTIARCH_CHART_VERSION>
  kubeos:
    family: KubeOS
    id: alaudaos.k.25
    rootfs_repository: tkestack/kubeos-rootfs
    iso_repository: tkestack/kubeos-iso
    source_tag: baremetal              # local tag after archive import. Do not write this into YAML.
    amd64_archive: <ACP_4_4_1_K25_AMD64_ARCHIVE>
    # <K25_AMD64_IMAGE_TAG>  this site (worked): alaudaos-44.ku.202610100215-0.x86_64
    # HCS Registration system-uri and catalog tag. Confirm with: ctr -n bare-metal-os images ls -q
    amd64_image_tag: alaudaos-44.ku.202610100215-0.x86_64
    amd64_sha256: <K25_AMD64_ARCHIVE_SHA256>
    amd64_catalog_key: v1.35.6-acp.9_amd64_alaudaos.k.25
    arm64_archive: <ACP_4_4_1_K25_ARM64_ARCHIVE>
    arm64_image_tag: <K25_ARM64_IMAGE_TAG>     # fill after arm64 archive import on finished Global
    arm64_sha256: <K25_ARM64_ARCHIVE_SHA256>
    arm64_catalog_key: v1.35.6-acp.9_arm64_alaudaos.k.25
    qcow2_amd64_file: kubeos:alaudaos-44.ku.202610100215-0.x86_64.qcow2
    qcow2_amd64_template: kubeos-202610100215-x86
    qcow2_arm64_file: kubeos:alaudaos-44.ku.202610100215-0.aarch64.qcow2
    qcow2_arm64_template: kubeos-202610100215-arm
    qcow2_boot: UEFI
    qcow2_system_disk: /dev/vda

# Four registries. Do not mix them.
# 127.0.0.1:11443              packtool / ctr push on the bootstrap node
# 172.18.0.1:11443             KIND AppRelease repoURL / Global SeedImage baseImage
# 156.3.1.26:11443             first Global OS pull + first Cluster annotation
# 156.3.1.50:11443             platform registry after installer Success
bootstrap:
  # <BOOTSTRAP_HOST_IP>  this site: 156.3.1.26
  # 01-dex-tls-bootstrap.yaml: Certificate commonName + ipAddresses SAN (also 127.0.0.1).
  # elemental-operator: https://156.3.1.26:12443
  # first Global Cluster/BaremetalCluster registry and OS pull: 156.3.1.26:11443
  host_ip: 156.3.1.26
  local_registry: 127.0.0.1:11443
  # <KIND_REGISTRY_ADDRESS>  this site: 172.18.0.1
  # bootstrap AppRelease repoURL + values.global.registry.address: 172.18.0.1:11443
  kind_registry_address: 172.18.0.1
  kind_registry: 172.18.0.1:11443
  node_registry: 156.3.1.26:11443
  elemental_server: https://156.3.1.26:12443
  installer_core_extract: /root
  installer_dir: /root/installer
  packtool: /root/installer/res/amd64/packtool

platform:
  # <PLATFORM_HOST>  this site: 156.3.1.50
  # installer JSON console.host / console.globalHost
  # finished-Global AppRelease values.global.host / platformUrl
  host: 156.3.1.50
  # <PLATFORM_REGISTRY>  this site: 156.3.1.50  write as 156.3.1.50:11443 in YAML
  # installer JSON registry.domain
  registry: 156.3.1.50
  registry_domain: 156.3.1.50:11443
  # <GLOBAL_CONTROL_PLANE_VIP>  this site: 156.3.1.50
  # bootstrap Bare Metal AppRelease handoffHook.controlPlaneVIP
  # Global BaremetalCluster.spec.controlPlaneLoadBalancer.host
  # installer JSON cluster.features.ha.vip
  global_control_plane_vip: 156.3.1.50
  global_control_plane_port: 6443
  workload_control_plane_vip: 156.3.1.95  # <WORKLOAD_CONTROL_PLANE_VIP>
  workload_control_plane_port: 6443
  # <NETWORK_DEVICE>  this site: eth0
  # BaremetalCluster.spec.networkDevice only. Do not put this on pool entries.
  network_device: eth0
  ingress_class: global-alb2           # hardcoded in AppRelease YAML. Do not change.

network:
  # Six CIDRs must not overlap each other or the management net.
  # Do not use 10.4.0.0/14 — that covers 10.5 and 10.6.
  # Global Cluster: pods=<GLOBAL_POD_CIDR> services=<GLOBAL_SERVICE_CIDR>
  # annotation cpaas.io/kube-ovn-join-cidr=<GLOBAL_KUBE_OVN_JOIN_CIDR>
  # kubernetes annotation stays v1.35.6-acp.9, kube-ovn v4.4.12
  global_pod_cidr: 10.3.0.0/16
  global_service_cidr: 10.4.0.0/16
  global_kube_ovn_join_cidr: 100.64.0.0/16
  workload_pod_cidr: 10.5.0.0/16       # <WORKLOAD_POD_CIDR>
  workload_service_cidr: 10.6.0.0/16   # <WORKLOAD_SERVICE_CIDR>
  workload_kube_ovn_join_cidr: 100.65.0.0/16 # <WORKLOAD_KUBE_OVN_JOIN_CIDR>

ssh:
  # <SSH_AUTHORIZED_KEY>  KCP / ARM worker / HCS cloud-init user boot. Same key.
  # Do not commit the live public key.
  authorized_key: <SSH_AUTHORIZED_KEY>

install:
  # HCS Registration-only YAML: /dev/vda
  # physical ISO YAML: /dev/elemental-install-target (WWN symlink on Live ISO)
  hcs_device: /dev/vda
  iso_device: /dev/elemental-install-target
  emulate_tpm: true
  emulated_tpm_seed: -1

# Hostnames are already written in the pool YAML.
# Inventory names are generated at register time. This site (worked):
#   <GLOBAL_CP_INVENTORY_1>  global-2cc1d3d7-4427-49e7-a880-e6a844d21a06  hostname global-cp-1
#   <GLOBAL_CP_INVENTORY_2>  global-864077b2-5685-4fe5-9d51-1f2fe682b0a9  hostname global-cp-2
#   <GLOBAL_CP_INVENTORY_3>  global-4cc70afc-3ec5-4090-9d55-9482dbe4bb37  hostname global-cp-3
# Next site: kubectl -n cpaas-system get machineinventory -o wide, then replace
# 02-control-plane-pool.yaml and 04-dcs-import-extra-resources.yaml. Do not reuse these UUIDs.
inventory:
  global_cp_1:
    name: global-2cc1d3d7-4427-49e7-a880-e6a844d21a06
    hostname: global-cp-1
  global_cp_2:
    name: global-864077b2-5685-4fe5-9d51-1f2fe682b0a9
    hostname: global-cp-2
  global_cp_3:
    name: global-4cc70afc-3ec5-4090-9d55-9482dbe4bb37
    hostname: global-cp-3
  workload_cp_1:
    name: <WORKLOAD_CP_INVENTORY_1>
    hostname: <WORKLOAD_CLUSTER_NAME>-cp-1
  workload_cp_2:
    name: <WORKLOAD_CP_INVENTORY_2>
    hostname: <WORKLOAD_CLUSTER_NAME>-cp-2
  workload_cp_3:
    name: <WORKLOAD_CP_INVENTORY_3>
    hostname: <WORKLOAD_CLUSTER_NAME>-cp-3
  workload_arm64_worker_1:
    name: <WORKLOAD_ARM64_WORKER_INVENTORY>
    hostname: <WORKLOAD_CLUSTER_NAME>-arm64-worker-1

# Physical ISO scene only. Check on each host; do not write WWN into shared YAML.
hosts:
  global_cp_1_os_disk_wwn: <GLOBAL_CP_1_OS_DISK_WWN>
  global_cp_2_os_disk_wwn: <GLOBAL_CP_2_OS_DISK_WWN>
  global_cp_3_os_disk_wwn: <GLOBAL_CP_3_OS_DISK_WWN>
  workload_cp_1_os_disk_wwn: <WORKLOAD_CP_1_OS_DISK_WWN>
  workload_cp_2_os_disk_wwn: <WORKLOAD_CP_2_OS_DISK_WWN>
  workload_cp_3_os_disk_wwn: <WORKLOAD_CP_3_OS_DISK_WWN>
  workload_arm64_worker_1_os_disk_wwn: <WORKLOAD_ARM64_WORKER_1_OS_DISK_WWN>

installer:
  # This site (worked): basic.username=admin, registry.username=registry.
  # AppRelease values.global.auth.default_admin is also "admin".
  # Passwords: echo -n '<plain>' | base64. Never commit the encoded value.
  admin_username: admin
  admin_password_base64: <BASE64_PLATFORM_ADMIN_PASSWORD>
  registry_username: registry
  registry_password: <REGISTRY_PASSWORD>
  registry_password_base64: <BASE64_REGISTRY_PASSWORD>
  deploy_mode: normal
  ha_is_third_party: true              # External VIP schema. Keep true.
